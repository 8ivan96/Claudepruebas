<title>Abfahrt Deutsch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: una red de metro alemana. Cada sección es una línea (U1–U7) con su color; las tareas del día salen en un panel de salidas. */
:root{
  --bg:#E9ECEF; --surface:#FFFFFF; --field:#FFFFFF; --ink:#12161B; --muted:#56616D; --rule:#C5CCD4;
  --sign:#0B4A9E; --sign-ink:#FFFFFF; --yellow:#F5C400; --yellow-ink:#12161B;
  --ok:#1B7F3B; --bad:#C62F1D; --okbg:#DDF1E3; --badbg:#FADDD8;
  --board:#0E1114; --board-ink:#F2F2EC; --board-amber:#FFC935; --board-rule:#2B3138;
  --l1:#3E8A1A; --l2:#D4321C; --l3:#0A7F62; --l4:#F5C400; --l5:#7B4F2C; --l6:#7A5AA6; --l7:#1479C4;
  --fd:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --fb:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif; --fm:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --line:var(--l1); --line-ink:#fff;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1216; --surface:#191E25; --field:#11151A; --ink:#ECEFF2; --muted:#9BA6B2; --rule:#2F3741;
  --sign:#0A3F87; --ok:#58C27D; --bad:#FF7A66; --okbg:#143222; --badbg:#3A1A15; --board:#07090B; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#191E25; --field:#11151A; --ink:#ECEFF2; --muted:#9BA6B2; --rule:#2F3741;
  --sign:#0A3F87; --ok:#58C27D; --bad:#FF7A66; --okbg:#143222; --badbg:#3A1A15; --board:#07090B; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--fb)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sign)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}

/* Cabecera: cartel de estación */
.top{background:var(--sign);color:var(--sign-ink)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:14px 12px;flex-wrap:wrap}
.top h1{font-size:30px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;flex:1;min-width:0}
.top h1 small{display:block;font:500 13px var(--fb);letter-spacing:0;text-transform:none;opacity:.85}
.tag{font:600 15px var(--fd);letter-spacing:.06em;text-transform:uppercase;background:var(--yellow);color:var(--yellow-ink);padding:4px 10px;border-radius:3px;white-space:nowrap}
#sync{font-size:12px;opacity:.85;flex-basis:100%}

/* Navegación: líneas */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:2px solid var(--rule)}
nav .wrap{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding-block:8px 6px}
nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);padding:2px 0;border-radius:4px;min-width:0}
nav a span{font:600 9.5px var(--fd);letter-spacing:0;text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis}
nav a[aria-current]{color:var(--ink)}
nav a[aria-current] .pill{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.pill{font:700 14px/1 var(--fd);padding:5px 7px;border-radius:3px;color:#fff;letter-spacing:.02em;display:inline-block}
.p1{background:var(--l1)}.p2{background:var(--l2)}.p3{background:var(--l3)}.p4{background:var(--l4);color:#12161B}.p5{background:var(--l5)}.p6{background:var(--l6)}.p7{background:var(--l7)}
main[data-l="1"]{--line:var(--l1)}main[data-l="2"]{--line:var(--l2)}main[data-l="3"]{--line:var(--l3)}
main[data-l="4"]{--line:var(--l4);--line-ink:#12161B}main[data-l="5"]{--line:var(--l5)}main[data-l="6"]{--line:var(--l6)}main[data-l="7"]{--line:var(--l7)}

main .wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
.st{display:flex;align-items:center;gap:12px}
.st h2{font-size:34px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.st h2 small{display:block;font:500 14px var(--fb);color:var(--muted);text-transform:none;letter-spacing:0}
.st .pill{font-size:22px;padding:8px 10px}
.route{height:6px;background:var(--line);border-radius:3px;position:relative;margin:2px 6px 0}
.route::before,.route::after{content:"";position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.route::before{left:-6px}.route::after{right:-6px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box h3{font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.lab{font:600 12px var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.de{font:600 22px/1.25 var(--fd);letter-spacing:.01em}
.big{font:700 56px/1 var(--fd);font-variant-numeric:tabular-nums}

.btn{border:2px solid var(--ink);background:transparent;border-radius:4px;padding:8px 14px;font:600 16px var(--fd);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;min-height:42px}
.btn.pri{background:var(--line);border-color:var(--line);color:var(--line-ink)}
.btn.sm{padding:4px 10px;min-height:34px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:wait}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.au{display:inline-flex;gap:4px;vertical-align:middle}
.au button{border:1px solid var(--rule);background:var(--field);border-radius:3px;min-height:32px;padding:2px 9px;font:600 13px var(--fd);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
input[type=text],textarea,select{width:100%;background:var(--field);border:2px solid var(--rule);border-radius:4px;padding:9px 11px;min-width:0}
input[type=text]:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{min-height:110px;resize:vertical}
.uml button{font:600 16px var(--fb);border:1px solid var(--rule);background:var(--field);border-radius:3px;width:38px;height:36px;cursor:pointer}
.fb{border-radius:4px;padding:10px 12px;font-size:15px}
.fb.ok{background:var(--okbg)} .fb.bad{background:var(--badbg)} .fb.info{background:var(--bg)}
.fb b.s{color:var(--ok)} .fb b.n{color:var(--bad)}
.aioff{display:none;background:var(--yellow);color:var(--yellow-ink);border-radius:4px;padding:8px 12px;font-size:14px}
body[data-ai="off"] .aioff{display:block}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.plain li{padding:10px 0;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:4px}
ul.plain li:first-child{border-top:0;padding-top:0}

/* Panel de salidas */
.board{background:var(--board);color:var(--board-ink);border-radius:4px;padding:12px 14px;font-family:var(--fm);font-size:14px}
.board .hd{display:flex;justify-content:space-between;color:var(--board-amber);font-weight:600;letter-spacing:.08em;padding-bottom:8px;border-bottom:1px solid var(--board-rule)}
.board a{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--board-rule);color:inherit;text-decoration:none}
.board a:last-child{border-bottom:0;padding-bottom:0}
.board a div{min-width:0}
.board .stt{color:var(--board-amber);font-variant-numeric:tabular-nums;white-space:nowrap}
.board .done .stt{color:#7BE39A}

/* Objetivo y semana */
.track{position:relative;height:8px;background:var(--rule);border-radius:4px;margin:8px 7px 22px}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--line);border-radius:4px}
.track b{position:absolute;top:-3px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--surface);border:3px solid var(--rule)}
.track b.on{border-color:var(--line)}
.track b span{position:absolute;top:16px;left:50%;transform:translateX(-50%);font:400 11px var(--fm);color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;position:relative;height:150px;padding-bottom:22px}
.week .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px;position:relative}
.week .v{font:400 11px var(--fm);color:var(--muted);font-variant-numeric:tabular-nums}
.week .bar{width:100%;max-width:38px;background:var(--muted);border-radius:2px 2px 0 0;min-height:2px}
.week .c.t .bar{background:var(--line)}
.week .d{position:absolute;bottom:-20px;font:600 13px var(--fd);letter-spacing:.05em}
.week .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--ink);opacity:.45;pointer-events:none}

/* Tarjetas */
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.boxes div{border:2px solid var(--rule);border-radius:4px;padding:6px 4px;text-align:center}
.boxes b{display:block;font:700 22px/1 var(--fd);font-variant-numeric:tabular-nums}
.boxes span{font-size:11px;color:var(--muted)}
.card{border:2px solid var(--ink);border-radius:4px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--field)}
.card .de{font-size:32px}

/* Dictado, bloques, fichas */
.w{display:inline-block;padding:2px 7px;border-radius:3px;margin:2px;font-weight:500}
.w.ok{background:var(--okbg)} .w.no{background:var(--badbg);text-decoration:underline wavy var(--bad)}
.blocks{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.bl{padding:5px 9px;border-radius:3px;font:600 18px var(--fd);letter-spacing:.01em;color:#fff}
.b-s{background:#1F6FD1}.b-v{background:#D4321C}.b-t{background:#F5C400;color:#12161B}.b-o{background:#1B7F3B}.b-ob{background:#7A5AA6}.b-k{background:#12161B;outline:1px solid #56616D}.b-x{background:#56616D}
.tiles{display:flex;flex-wrap:wrap;gap:6px;min-height:50px;align-items:center}
.tiles.ans{border:2px dashed var(--rule);border-radius:4px;padding:8px}
.tile{border:2px solid var(--ink);background:var(--field);border-radius:4px;padding:7px 12px;font:600 19px var(--fd);cursor:pointer;min-height:42px}
.lyr{font-size:16px;line-height:2.1;white-space:pre-wrap;word-break:break-word}
.lyr input.gap{display:inline-block;width:auto;padding:2px 6px;border-width:0 0 2px;border-radius:0;font:inherit;background:var(--bg);max-width:100%}
.lyr input.gap.ok{background:var(--okbg);border-color:var(--ok)} .lyr input.gap.no{background:var(--badbg);border-color:var(--bad)}
details{border-top:1px solid var(--rule);padding-top:10px}
details summary{font:600 18px var(--fd);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
details>div{display:flex;flex-direction:column;gap:10px;padding-top:10px}
table{border-collapse:collapse;font-size:15px}td,th{border:1px solid var(--rule);padding:5px 9px;text-align:left}.tbl{overflow-x:auto}
a.lnk{color:inherit;font-weight:600;text-underline-offset:3px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-size:14px;max-width:min(92vw,480px);z-index:20}
@media (max-width:420px){.st h2{font-size:28px}.top h1{font-size:25px}}
@media (prefers-reduced-motion:no-preference){.track i,.week .bar{transition:all .4s}}
</style>

const nextBox=(b,ok)=>ok?Math.min((b||0)+1,4):1;
function diffWords(target,typed){ // alineación por subsecuencia común más larga, palabra a palabra
  const a=target.split(/\s+/),an=a.map(norm),b=norm(typed).split(' ').filter(Boolean),m=a.length,n=b.length;
  const L=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=an[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[],extra=[];let i=0,j=0;
  while(i<m){ if(j<n&&an[i]===b[j]){out.push({w:a[i],ok:1});i++;j++} else if(j<n&&L[i][j+1]>=L[i+1][j]){extra.push(b[j++])} else {out.push({w:a[i],ok:0});i++} }
  return {out,extra:extra.concat(b.slice(j)),hit:out.filter(x=>x.ok).length,total:m};
}

function save(songId){
  S.u=Date.now(); if(songId&&SONGS[songId])SONGS[songId].u=S.u;
  try{localStorage.setItem(LS,JSON.stringify(S));localStorage.setItem(LS+'-songs',JSON.stringify(SONGS))}catch(e){}
  dirty=true; if(songId)dirtySongs.add(songId); clearTimeout(saveT); saveT=setTimeout(push,1500); head();

async function push(){
  if(!col||saving||!dirty)return; saving=true; dirty=false; const ids=[...dirtySongs]; dirtySongs.clear();
  try{ await col.doc('state').set({u:S.u,json:JSON.stringify(S)});
    for(const id of ids){ if(SONGS[id])await col.doc('song_'+id).set({u:SONGS[id].u,json:JSON.stringify(SONGS[id])}); else await col.doc('song_'+id).delete() }
    $('#sync').textContent='Progreso guardado en tu cuenta';
  }catch(e){ dirty=true; ids.forEach(i=>dirtySongs.add(i)); $('#sync').textContent='Guardado en este navegador (la cuenta no responde ahora)'; }
  saving=false; if(dirty){clearTimeout(saveT);saveT=setTimeout(push,8000)}
}
async function pull(){
  try{ const snap=await col.get(); let changed=false;
    for(const d of snap.docs){ const v=d.data(); if(!v||!v.json)continue; const o=JSON.parse(v.json);
      if(d.id==='state'){ if((o.u||0)>(S.u||0)){S=Object.assign(S,o);changed=true} }
      else if(d.id.startsWith('song_')){ const id=d.id.slice(5); if(!SONGS[id]||(o.u||0)>(SONGS[id].u||0)){SONGS[id]=o;changed=true} } }
    if(changed){try{localStorage.setItem(LS,JSON.stringify(S));localStorage.setItem(LS+'-songs',JSON.stringify(SONGS))}catch(e){} render()}
    $('#sync').textContent='Progreso guardado en tu cuenta';
    if(S.u&&!changed){dirty=true;Object.keys(SONGS).forEach(i=>dirtySongs.add(i));push()}
  }catch(e){ $('#sync').textContent='Guardado en este navegador' }
}

const SRC=[['Lektion 0',LEK0],['Lektion 1',LEK1],['Libreta',HEFT],['General',VOCAB]];
const words=()=>SRC.flatMap(([g,a])=>a.map(v=>({de:v[0],es:v[1],ex:v[2],exEs:v[3],g}))).concat(S.my.map(w=>({...w,g:'Mías'})));
function queue(){const t=day(),w=words(),left=Math.max(0,12-(today().k.n||0));
  return w.filter(x=>S.cards[x.de]?.b>0&&S.cards[x.de].d<=t).concat(w.filter(x=>!S.cards[x.de]?.b).sort((a,b)=>(b.g===S.src0)-(a.g===S.src0)).slice(0,left))}
function grade(w,ok){const c=S.cards[w.de]||{b:0};if(!c.b){const d=S.days[day()]=S.days[day()]||{p:0,k:{}};d.k.n=(d.k.n||0)+1}
  const b=nextBox(c.b,ok);S.cards[w.de]={b,d:day(INTERVAL[b])};if(!ok)err('Vocabulario',w.es,w.de);pts(ok?2:0,'c')}
function addWord(de,es,ex){de=de.trim();es=es.trim();if(!de||!es)return false;if(words().some(w=>w.de===de)){toast('Esa palabra ya está en tus tarjetas.');return false}
  S.my.push({de,es,ex:ex||'',exEs:''});save();toast('Añadida a tus tarjetas: '+de);return true}

      <div class="row" style="justify-content:center"><button class="btn" data-a="grade" data-ok="0">No la sabía</button><button class="btn pri" data-a="grade" data-ok="1">La sabía</button></div>`

const links=q=>`<a class="lnk" href="https://open.spotify.com/search/${encodeURIComponent(q)}" target="_blank" rel="noopener">Spotify</a> · <a class="lnk" href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}" target="_blank" rel="noopener">YouTube</a>`;
const LW=/[A-Za-zÄÖÜäöüß]/;
function gapLines(s){ // huecos repartidos por toda la letra: una línea de cada «paso», con desplazamiento según la semilla
  const step=[4,4,2,1][s.lvl||1],r=rng((s.seed||1)*7919+(s.lvl||1)),off=(s.seed||1)%step;let k=0;
  return s.ly.split('\n').map(ln=>{const tk=ln.split(/(\s+)/),cand=tk.map((t,i)=>(t.match(/[A-Za-zÄÖÜäöüß]/g)||[]).length>=3?i:-1).filter(i=>i>=0);
    if(!cand.length||(k++%step)!==off)return{tk,g:[]};
    const g=[cand[r()*cand.length|0]];if(s.lvl===3&&cand.length>=5){const o=cand.filter(i=>i!==g[0]);g.push(o[r()*o.length|0])}return{tk,g}});
}

    return esc(m[1])+`<input type="text" class="gap" data-w="${esc(m[2])}" size="${Math.max(4,m[2].length+1)}" placeholder="${esc(hint(m[2]))}" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Hueco">`+esc(m[3])}).join('')).join('\n');

  return `<div class="row"><button class="btn sm" data-a="songBack">← Mis canciones</button></div>
  <div class="box"><h3>${esc(s.t)}</h3><p class="muted">${esc(s.a)} · Escúchala en ${links(q)}</p>
   ${L?`<details open><summary>De qué trata</summary><div><p>${esc(L.resumen)}</p></div></details>
   <details><summary>Vocabulario</summary><div><ul class="plain">${(L.vocab||[]).map((v,i)=>`<li><span class="de" style="font-size:19px">${esc(v.de)} ${au(v.de)}</span><span>${esc(v.es)}</span>${v.ej?`<span class="muted small">${esc(v.ej)}</span>`:''}<span><button class="btn sm" data-a="songAdd" data-i="${i}">A mis tarjetas</button></span></li>`).join('')}</ul></div></details>
   <details><summary>Lengua coloquial</summary><div><ul class="plain">${(L.coloquial||[]).map(v=>`<li><span class="de" style="font-size:19px">${esc(v.de)} ${au(v.de)}</span><span>${esc(v.es)}</span></li>`).join('')||'<li class="muted">Esta letra no tiene formas coloquiales destacables.</li>'}</ul></div></details>
   <details><summary>Gramática</summary><div><ul class="plain">${(L.gramatica||[]).map(v=>`<li><b>${esc(v.regla)}</b><span class="de" style="font-size:19px">${esc(v.ejemplo)} ${au(v.ejemplo)}</span><span class="muted small">${esc(v.explica)}</span></li>`).join('')}</ul></div></details>`
   :`<p class="fb info">Esta canción todavía no tiene lección de Claude. Los huecos ya funcionan. <button class="btn sm" data-a="songLesson">Crear la lección con Claude</button></p>`}
   <details open><summary>Huecos</summary><div>
    <div class="row">${[[1,'Fácil'],[2,'Medio'],[3,'Difícil']].map(([n,t])=>`<button class="chip" data-a="gapLvl" data-n="${n}" aria-pressed="${(s.lvl||1)===n}">${t}</button>`).join('')}<button class="btn sm" data-a="gapNew">Cambiar huecos</button></div>

   ${L&&(L.reformular||[]).length?`<details><summary>Reformular versos</summary><div>${chk('r',L.reformular,x=>`<p class="de" style="font-size:19px">${esc(x.verso)} ${au(x.verso)}</p><p><b>Instrucción:</b> ${esc(x.instruccion)}</p>`)}</div></details>`:''}

   <div class="row" style="border-top:1px solid var(--rule);padding-top:12px"><button class="btn sm" data-a="songDel">Borrar esta canción</button></div></div>`;

   <span class="lab">La hora coloquial</span>
   <ul class="plain">${[['8:05','Es ist fünf nach acht.'],['8:15','Es ist Viertel nach acht.'],['8:30','Es ist halb neun.'],['8:45','Es ist Viertel vor neun.'],['8:50','Es ist zehn vor neun.']].map(h=>`<li><span><b style="font-family:var(--fm)">${h[0]}</b> <span class="de" style="font-size:19px">${h[1]}</span> ${au(h[1])}</span></li>`).join('')}</ul>
   <p class="fb info"><b>Truco:</b> «halb neun» no son las nueve y media: es medio camino hacia las nueve.</p>
   <span class="lab">Artículos por caso</span>
   <div class="tbl"><table><tr><th></th><th>der</th><th>die</th><th>das</th><th>plural</th></tr><tr><th>Nominativo</th><td>der / ein</td><td>die / eine</td><td>das / ein</td><td>die</td></tr><tr><th>Acusativo</th><td><b>den / einen</b></td><td>die / eine</td><td>das / ein</td><td>die</td></tr><tr><th>Dativo</th><td>dem / einem</td><td>der / einer</td><td>dem / einem</td><td>den + n</td></tr></table></div>
   <span class="lab">Pronombres</span>
   <div class="tbl"><table><tr><th>Nominativo</th><td>ich</td><td>du</td><td>er</td><td>sie</td><td>es</td><td>wir</td><td>ihr</td><td>Sie</td></tr><tr><th>Acusativo</th><td>mich</td><td>dich</td><td>ihn</td><td>sie</td><td>es</td><td>uns</td><td>euch</td><td>Sie</td></tr><tr><th>Dativo</th><td>mir</td><td>dir</td><td>ihm</td><td>ihr</td><td>ihm</td><td>uns</td><td>euch</td><td>Ihnen</td></tr></table></div>
   <p class="small"><b>Siempre con dativo:</b> aus, bei, mit, nach, seit, von, zu. <b>Siempre con acusativo:</b> durch, für, gegen, ohne, um.</p>
   <p class="fb info"><b>Truco:</b> si hay movimiento hacia un sitio (¿adónde?), acusativo; si algo está quieto (¿dónde?), dativo.</p></div>`:''}
  <div class="box"><h3>Minijuego: ¿qué significa de verdad?</h3><p class="de">${esc(I[0])} ${au(I[0])}</p><p class="muted">Literalmente: ${esc(I[1])}</p>
   <div style="display:flex;flex-direction:column;gap:6px">${g.opts.map(o=>`<button class="chip" style="text-align:left;border-radius:4px;${g.pick!==null&&o===g.q?'background:var(--okbg);color:var(--ink)':g.pick===o?'background:var(--badbg);color:var(--ink)':''}" data-a="idiPick" data-o="${o}" ${g.pick!==null?'disabled':''}>${esc(IDI[o][2])}</button>`).join('')}</div>
   <div class="row"><span class="muted small">Aciertos seguidos: ${g.ok}</span>${g.pick!==null?`<button class="btn sm pri" data-a="idiNext">Otra</button><button class="btn sm" data-a="idiAdd" data-i="${g.q}">A mis tarjetas</button>`:''}</div></div>
  <div class="box"><h3>30 frases hechas</h3><ul class="plain">${IDI.map((x,i)=>`<li><span class="de" style="font-size:20px">${esc(x[0])} ${au(x[0])}</span><span class="muted small">Literal: ${esc(x[1])}</span><span>${esc(x[2])}</span><span><button class="btn sm" data-a="idiAdd" data-i="${i}">A mis tarjetas</button></span></li>`).join('')}</ul></div>`;
};

/* ---- U7 Orden ---- */
const ordList=()=>ORD.concat(S.genOrd).filter(x=>U.ord.r==='todo'?TLV[x.r]<=S.lvl:x.r===U.ord.r);
function ordSet(i){const L=ordList();const o=U.ord;o.i=L.length?(i+L.length)%L.length:0;o.pick=[];o.res=null;const ex=L[o.i];if(!ex){o.pool=[];return}
  const w=ex.a[0].split(' ');let p;do{p=shuffle(w.map((x,k)=>({x,k})))}while(w.length>2&&p.map(t=>t.x).join(' ')===ex.a[0]);o.pool=p}
V.orden=()=>{ const o=U.ord; if(!o.pool)ordSet(o.i); const L=ordList(),ex=L[o.i];
  const chips=`<div class="row" role="group" aria-label="Regla">${[['todo','Todas']].concat(RULES.filter(r=>TLV[r.id]<=S.lvl).map(r=>[r.id,r.n.split(':')[0]])).map(([k,n])=>`<button class="chip" data-a="ordRule" data-r="${k}" aria-pressed="${o.r===k}">${esc(n)}</button>`).join('')}</div>`;
  if(!ex)return chips+'<div class="box"><p class="muted">No hay frases de esta regla todavía. Genera algunas con Claude.</p><div class="row"><button class="btn" data-a="ordGen">Generar frases nuevas</button></div></div>';
  const acc=ex.a.concat(S.ordOk[ex.es]||[]);
  return chips+`<div class="box"><span class="lab">${esc(RNAME[ex.r]||'Frase')} · ${o.i+1} de ${L.length}</span><p style="font-size:20px">${esc(ex.es)}</p>
   <div class="tiles ans" aria-label="Tu frase">${o.pick.map((t,k)=>`<button class="tile" data-a="ordOut" data-k="${k}">${esc(k===0?cap(t.x):t.x)}</button>`).join('')||'<span class="muted small">Toca las palabras en orden</span>'}</div>
   <div class="tiles" aria-label="Palabras disponibles">${o.pool.map((t,k)=>`<button class="tile" data-a="ordIn" data-k="${k}">${esc(t.x)}</button>`).join('')}</div>
   <div class="row"><button class="btn pri" data-a="ordCheck" ${o.pool.length?'disabled style="cursor:not-allowed"':''}>Comprobar</button><button class="btn" data-a="ordClear">Borrar</button><button class="btn" data-a="ordNext">Siguiente</button></div>
   ${o.res===true?`<p class="fb ok"><b class="s">Richtig!</b> ${au(o.pick.map(t=>t.x).join(' '))}${acc.length>1?'<br>También vale: '+acc.filter(a=>norm(a)!==norm(o.pick.map(t=>t.x).join(' '))).map(a=>esc(cap(a))).join(' · '):''}</p>`:''}
   ${o.res===false?`<p class="fb bad"><b class="n">Todavía no.</b> Órdenes correctos: ${acc.map(a=>esc(cap(a))).join(' · ')} ${au(acc[0])}<br><span class="small">${esc(RULES.find(r=>r.id===ex.r)?.e||'')}</span></p>
     <div class="row"><button class="btn" data-a="ordAsk">¿Mi orden también vale?</button></div>`:''}
   <div id="ordOut"></div></div>
  <div class="row"><button class="btn" data-a="ordGen">Generar frases nuevas con Claude</button></div>`;
};

/* ============ ACCIONES ============ */
const fb=(ok,html)=>`<p class="fb ${ok?'ok':'bad'}">${html}</p>`;
const A={
  say:b=>say(b.dataset.t,+b.dataset.r),
  uml:b=>{const i=lastIn;if(!i||!i.isConnected)return;const s=i.selectionStart??i.value.length;i.value=i.value.slice(0,s)+b.dataset.c+i.value.slice(i.selectionEnd??s);i.focus();i.setSelectionRange(s+1,s+1)},
  // Reformular
  refTopic:b=>{U.ref={t:b.dataset.t,i:0};render()},
  refNext:()=>{U.ref.i++;render()},
  refSol:()=>{const ex=refList()[U.ref.i];$('#refOut').innerHTML=`<p class="fb info"><b>Solución:</b> ${ex.sol.map(s=>esc(s)+' '+au(s)).join('<br>')}<br><span class="small">${esc(ex.why||WHY[ex.t]||'')}</span></p>`},
  refCheck:async b=>{const ex=refList()[U.ref.i],vals=[1,2,3].map(n=>$('#ref'+n).value.trim()).filter(Boolean);
    if(!vals.length)return toast('Escribe al menos una versión.');
    let r=await ask('{"versiones":[{"ok":true,"corregida":"versión correcta más cercana a la suya","porque":"qué falla o por qué está bien"}],"regla":"la regla en una frase"}',
      `Ejercicio de reformular. Frase original: «${ex.s}». Instrucción: «${ex.i}». Soluciones modelo: ${ex.sol.join(' | ')}. Corrige cada versión del alumno, una entrada por versión y en el mismo orden. Da por buena cualquier versión gramaticalmente correcta que cumpla la instrucción y conserve el sentido; ignora mayúsculas y puntuación final.\n<alumno>${JSON.stringify(vals)}</alumno>`,b);
    const off=!r||!Array.isArray(r.versiones)||r.versiones.length<vals.length;
    if(off)r={versiones:vals.map(v=>({ok:ex.sol.some(s=>norm(s)===norm(v)),corregida:ex.sol[0],porque:''})),regla:ex.why||WHY[ex.t]||''};
    $('#refOut').innerHTML=vals.map((v,i)=>{const x=r.versiones[i],ok=!!x.ok;if(ok)pts(5,'r');else{err('Reformular',v,x.corregida||ex.sol[0]);pts(0,'r')}
      return fb(ok,`<b class="${ok?'s':'n'}">${ok?'Richtig!':'Casi.'}</b> ${esc(v)}${ok?'':`<br>Mejor: <b>${esc(x.corregida||ex.sol[0])}</b> ${au(x.corregida||ex.sol[0])}`}${x.porque?`<br><span class="small">${esc(x.porque)}</span>`:''}`)}).join('')
      +`<p class="fb info"><b>Regla:</b> ${esc(r.regla||WHY[ex.t]||'')}${off?'<br><span class="small">Corrección sin Claude: comparo con las soluciones guardadas ('+ex.sol.map(esc).join(' · ')+'). Otra versión tuya puede ser correcta también.</span>':''}</p>`;
    save()},
  refGen:async b=>{if(!needAI())return;const t=U.ref.t==='todo'?(S.lvl?'orden':'verbo'):U.ref.t;
    const r=await ask('{"ejercicios":[{"s":"frase corta en alemán","es":"traducción","i":"instrucción en español","sol":["solución correcta","otra solución si existe"]}]}',`Crea 3 ejercicios nuevos de reformular sobre el tema «${RTOP[t]}». Frases cortas y divertidas sobre trabajo, pareja y suegros, viajes, Rammstein, cine o series. La instrucción debe ser concreta (empieza por…, une con…, niégala, pásala al Perfekt…).`,b);
    const L=(r?.ejercicios||[]).filter(x=>x&&x.s&&x.i&&Array.isArray(x.sol)&&x.sol.length).map(x=>({t,s:String(x.s),es:String(x.es||''),i:String(x.i),sol:x.sol.map(String)}));
    if(!L.length)return;S.genRef.push(...L);save();U.ref.i=refList().length-L.length;render();toast(L.length+' ejercicios nuevos')},
  mine:async b=>{const v=$('#mine').value.trim();if(!v)return toast('Escribe una frase primero.');if(!needAI())return;
    const r=await ask('{"ok":true,"corregida":"la frase correcta en alemán","porque":"qué estaba mal y la regla, o por qué está bien","formas":[{"de":"otra forma de decirlo","nota":"cuándo usarla: formal, coloquial, más simple…"}]}',`El alumno quiere decir esto. Si está en alemán, corrígelo; si está en español, tradúcelo a alemán sencillo. Después da exactamente 3 formas distintas de decirlo.\n<alumno>${v.slice(0,600)}</alumno>`,b);
    if(!r||!r.corregida)return;if(!r.ok)err('Mis frases',v,r.corregida);pts(3,'m');
    $('#mineOut').innerHTML=fb(!!r.ok,`<b class="${r.ok?'s':'n'}">${r.ok?'Está bien dicha.':'Corregida:'}</b> ${esc(r.corregida)} ${au(r.corregida)}<br><span class="small">${esc(r.porque)}</span>`)
      +(r.formas||[]).slice(0,3).map(f=>`<p class="fb info"><span class="de" style="font-size:19px">${esc(f.de)}</span> ${au(f.de)}<br><span class="small">${esc(f.nota)}</span></p>`).join('')},
  // Vocabulario
  setLvl:b=>{S.lvl=+b.dataset.n;S.src0=['Lektion 0','Lektion 1',S.src0][S.lvl];U.ref={t:'todo',i:0};U.ord.r='todo';U.dic.i=0;ordSet(0);save();render()},
  vocSrc:b=>{S.src0=b.dataset.g;save();render()},
  vocMode:b=>{U.voc.m=b.dataset.m;U.voc.show=false;render()},
  flip:()=>{U.voc.show=true;render()},
  grade:b=>{const c=queue()[0];if(c)grade(c,b.dataset.ok==='1');U.voc.show=false;render()},
  wrCheck:b=>{const c=queue()[0],v=$('#wr').value;if(!c)return;if(b.dataset.done){render();return}
    const ok=[c.de].concat(c.de.split(' / ')).some(o=>norm(o)===norm(v));
    $('#wrOut').innerHTML=fb(ok,`<b class="${ok?'s':'n'}">${ok?'Richtig!':'Era:'}</b> ${esc(c.de)} ${au(c.de.split(' / ')[0])}${c.ex?`<br><span class="small">${esc(c.ex)}</span>`:''}`);
    grade(c,ok);b.dataset.done=1;b.textContent='Siguiente'},
  addWord:()=>{if(addWord($('#nwDe').value,$('#nwEs').value,$('#nwEx').value.trim()))render()},
  // Oído
  dicNext:()=>{U.dic.i++;render()},
  dicCheck:()=>{const d=DL()[U.dic.i%DL().length],v=$('#dic').value;if(!v.trim())return toast('Escribe lo que has oído.');
    const r=diffWords(d[0],v),pc=Math.round(r.hit/r.total*100);if(pc<100)err('Dictado',v,d[0]);pts(pc>=80?5:2,'d');
    $('#dicOut').innerHTML=`<p class="fb ${pc===100?'ok':'info'}"><b>${r.hit} de ${r.total} palabras</b> (${pc} %)<br>${r.out.map(x=>`<span class="w ${x.ok?'ok':'no'}">${esc(x.w)}</span>`).join('')}
     ${r.extra.length?`<br><span class="small">Escribiste y no estaba: ${r.extra.map(esc).join(', ')}</span>`:''}<br><span class="muted small">${esc(d[1])}</span> ${au(d[0])}</p>`},
  // Canciones
  artAdd:()=>{const v=$('#art').value.trim();if(!v)return;if(!S.artists.includes(v))S.artists.push(v);save();render()},
  artDel:b=>{S.artists.splice(+b.dataset.i,1);save();render()},
  songOpen:b=>{U.song=b.dataset.id;render();scrollTo(0,0)},
  songBack:()=>{U.song=null;render()},
  songNew:async b=>{const t=$('#sgT').value.trim(),a=$('#sgA').value.trim(),ly=$('#sgL').value.trim();
    if(!t||ly.length<40)return toast('Pon el título y pega la letra completa.');
    const id=Date.now().toString(36),s=SONGS[id]={id,t,a:a||'—',ly,seed:1,lvl:1,les:null,u:0};save(id);
    if(ai)await makeLesson(s,b); U.song=id;render();scrollTo(0,0);if(!s.les)toast('Lección creada solo con huecos. Podrás añadir el resto cuando Claude esté disponible.')},
  songLesson:async b=>{if(!needAI())return;if(await makeLesson(SONGS[U.song],b))render()},
  songDel:b=>{if(!b.dataset.sure){b.dataset.sure=1;b.textContent='¿Seguro? Pulsa otra vez para borrar';return}delete SONGS[U.song];save(U.song);U.song=null;render()},
  songAdd:b=>{const v=SONGS[U.song].les.vocab[+b.dataset.i];addWord(v.de,v.es,v.ej)},
  gapLvl:b=>{const s=SONGS[U.song];s.lvl=+b.dataset.n;save(s.id);render()},
  gapNew:()=>{const s=SONGS[U.song];s.seed=(s.seed||1)+1;save(s.id);render()},
  gapCheck:()=>{const g=[...document.querySelectorAll('#lyr .gap')];let ok=0;g.forEach(i=>{const y=norm(i.value)===norm(i.dataset.w);i.classList.toggle('ok',y);i.classList.toggle('no',!y);ok+=y});
    if(ok)pts(Math.min(10,ok),'s');$('#gapOut').innerHTML=`<p class="fb ${ok===g.length?'ok':'info'}"><b>${ok} de ${g.length} huecos</b>. ${ok===g.length?'Sube de nivel o cambia los huecos.':'Los rojos, escúchalos otra vez.'}</p>`},
  gapSol:()=>document.querySelectorAll('#lyr .gap').forEach(i=>{if(norm(i.value)!==norm(i.dataset.w)){i.value=i.dataset.w;i.classList.add('no')}}),
  songSol:b=>{const k=b.dataset.k,x=SONGS[U.song].les[k==='r'?'reformular':'preguntas'][+b.dataset.i],m=k==='r'?x.solucion:x.r;$('#o'+k+b.dataset.i).innerHTML=`<p class="fb info"><b>Respuesta modelo:</b> ${esc(m)} ${au(m)}</p>`},
  songCheck:async b=>{const k=b.dataset.k,i=b.dataset.i,x=SONGS[U.song].les[k==='r'?'reformular':'preguntas'][+i],v=$('#s'+k+i).value.trim(),m=k==='r'?x.solucion:x.r;
    if(!v)return toast('Escribe tu respuesta.');
    const r=await ask('{"ok":true,"corregida":"versión correcta","porque":"explicación breve"}',(k==='r'?`Verso: «${x.verso}». Instrucción: «${x.instruccion}». Solución modelo: «${m}».`:`Pregunta: «${x.p}». Respuesta modelo: «${m}».`)+` Corrige la respuesta del alumno; acepta cualquier respuesta correcta en alemán sencillo.\n<alumno>${v.slice(0,400)}</alumno>`,b);
    if(!r||typeof r.ok!=='boolean')return A.songSol(b);
    if(r.ok)pts(5,'s');else err('Canciones',v,r.corregida||m);save();
    $('#o'+k+i).innerHTML=fb(r.ok,`<b class="${r.ok?'s':'n'}">${r.ok?'Richtig!':'Mejor:'}</b> ${r.ok?'':esc(r.corregida||m)+' '+au(r.corregida||m)}<br><span class="small">${esc(r.porque)}</span>`)},
  // Gramática
  idiPick:b=>{const g=U.idi;g.pick=+b.dataset.o;if(g.pick===g.q){g.ok++;pts(1,'i')}else{g.ok=0;err('Frases hechas',IDI[g.pick][2],IDI[g.q][0]+' = '+IDI[g.q][2]);save()}render()},
  idiNext:()=>{newIdi();render()},
  idiAdd:b=>{const x=IDI[+b.dataset.i];addWord(x[0],x[2]+' (literal: '+x[1]+')','')},
  // Orden
  ordRule:b=>{U.ord.r=b.dataset.r;ordSet(0);render()},
  ordIn:b=>{const o=U.ord;o.pick.push(o.pool.splice(+b.dataset.k,1)[0]);o.res=null;render()},
  ordOut:b=>{const o=U.ord;o.pool.push(o.pick.splice(+b.dataset.k,1)[0]);o.res=null;render()},
  ordClear:()=>{ordSet(U.ord.i);render()},
  ordNext:()=>{ordSet(U.ord.i+1);render()},
  ordCheck:()=>{const o=U.ord,ex=ordList()[o.i],mine=o.pick.map(t=>t.x).join(' ');if(o.pool.length||o.res!==null)return;
    o.res=ex.a.concat(S.ordOk[ex.es]||[]).some(a=>norm(a)===norm(mine));if(o.res)pts(3,'o');else{err('Orden',cap(mine),cap(ex.a[0]));pts(0,'o')}render()},
  ordAsk:async b=>{const o=U.ord,ex=ordList()[o.i],mine=o.pick.map(t=>t.x).join(' ');if(!needAI())return;
    const r=await ask('{"ok":true,"porque":"por qué vale o por qué no, citando la regla"}',`El alumno ordena palabras para traducir «${ex.es}». Órdenes aceptados: ${ex.a.join(' | ')}. Su orden: «${mine}». ¿Es también una frase alemana gramaticalmente correcta y natural con el mismo sentido? Ignora mayúsculas y puntuación.`,b);
    if(!r||typeof r.ok!=='boolean')return;
    if(r.ok){(S.ordOk[ex.es]=S.ordOk[ex.es]||[]).push(mine);pts(3,'o');o.res=true;render();toast('Tu orden también vale. Anotado.')}
    else $('#ordOut').innerHTML=fb(false,`<b class="n">No vale.</b> ${esc(r.porque)}`)},
  ordGen:async b=>{if(!needAI())return;const rr=U.ord.r==='todo'?'':` Todas de la regla «${RNAME[U.ord.r]}» (r="${U.ord.r}").`;
    const r=await ask('{"frases":[{"es":"frase en español","a":["orden correcto en alemán sin puntuación","otro orden también correcto, si existe"],"r":"'+RULES.filter(r=>TLV[r.id]<=S.lvl).map(r=>r.id).join('|')+'"}]}',`Crea 4 frases nuevas de nivel ${LV()} para un ejercicio de ordenar palabras, de ${S.lvl?'4 a 9':'3 a 6'} palabras, sobre trabajo, pareja, viajes, Rammstein, cine o series, con humor.${rr} Todos los órdenes de «a» deben usar exactamente las mismas palabras. Sin puntuación. Primera palabra en minúscula salvo que sea un sustantivo.`,b);
    const L=(r?.frases||[]).filter(x=>x&&x.es&&Array.isArray(x.a)&&x.a.length&&x.a.every(s=>typeof s==='string'&&s.trim())).map(x=>({es:String(x.es),a:x.a.map(s=>s.replace(/[.,!?]/g,'').trim()),r:TLV[x.r]<=S.lvl?x.r:'v2'}));
    if(!L.length)return;S.genOrd.push(...L);save();ordSet(ordList().length-L.length);render();toast(L.length+' frases nuevas')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled&&A[b.dataset.a])A[b.dataset.a](b)});
document.addEventListener('change',e=>{if(e.target.dataset.ch==='goal'){S.goal=+e.target.value;save();render()}});
document.addEventListener('input',e=>{if(e.target.dataset.in==='vq'){U.voc.q=e.target.value;const f=norm(U.voc.q);document.querySelectorAll('#vlist li').forEach(li=>li.hidden=!!f&&!norm(li.textContent).includes(f))}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;const m={wr:'wrCheck',dic:'dicCheck',ref1:'refCheck',ref2:'refCheck',ref3:'refCheck'}[e.target.id];if(m)document.querySelector(`[data-a="${m}"]`)?.click()});
addEventListener('hashchange',()=>{U.song=null;render();scrollTo(0,0)});

/* ============ ARRANQUE ============ */
render();
(async()=>{
  const c=window.claude; if(!c||!c.use){document.body.dataset.ai='off';return}
  c.use('sample').then(s=>{ai=s;document.body.dataset.ai=s?'on':'off'});
  c.use('tts').then(t=>ttsCap=t);
  const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
  if(!db||!user)return;
  try{const id=await user.id();if(!id)return;col=db.collection('data/users/'+id);await pull()}catch(e){}
})();
</script>
